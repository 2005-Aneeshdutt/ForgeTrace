# Neo4j graph store for ForgeTrace (docs/DECISIONS.md D-62). Start: `make graph-up`.
# Local, offline after the first image pull. Data lives in the named volume, not in the repo.
services:
  neo4j:
    image: neo4j:2025.09.0-community
    container_name: forgetrace-neo4j
    ports:
      - "127.0.0.1:7474:7474"   # browser UI (localhost only)
      - "127.0.0.1:7687:7687"   # bolt
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-forgetrace-dev}"
      NEO4J_server_memory_heap_initial__size: "1g"
      NEO4J_server_memory_heap_max__size: "2g"
      NEO4J_server_memory_pagecache_size: "1g"
      NEO4J_dbms_security_procedures_unrestricted: ""
    volumes:
      - forgetrace-neo4j-data:/data
volumes:
  forgetrace-neo4j-data:
