# Credential Access pack. label_priority: lower wins when one raw event matches several rules.
- id: R001
  version: 1
  title: Brute-force authentication burst from one source
  author: forgetrace
  technique: T1110
  tactic: Credential Access
  severity: 3
  confidence: 0.7   # a 20+/10 min failure burst from one source is rarely benign; typos come in ones and twos
  label_priority: 20
  type: threshold
  filter:
    all:
      - {field: event_type, op: eq, value: auth_fail}
      - {field: src_ip, op: not_null}
  group_by: [src_ip]
  threshold: {count: 20, window: 10m}
  aggregate_by: [src_ip]

- id: R001c
  version: 1
  title: Repeated failures followed by a success for the same source and account
  author: forgetrace
  technique: T1110
  tactic: Credential Access
  severity: 4
  confidence: 0.9   # failures then success on the same account/source is the classic compromise signal
  label_priority: 25
  type: threshold
  filter:
    all:
      - {field: event_type, op: eq, value: auth_fail}
      - {field: src_ip, op: not_null}
      - {field: user, op: not_null}
  group_by: [src_ip, user]
  threshold: {count: 5, window: 30m}
  followed_by:
    filter:
      all:
        - {field: event_type, op: eq, value: auth_success}
    join_on: [src_ip, user]
    within: 30m
  aggregate_by: [src_ip, user]
