# FortiGate behaviour pack (RT-2 coverage; DECISIONS D-69). Behaviour only, by owner decision:
# no rule reads the firewall's own verdicts (IPS attack name, AV virus name, web-filter category,
# app risk). Conditions use counts, distinct counts, byte sums, ports, URL/DNS shapes, login outcomes,
# configuration messages, countries and the derived subnet / local-hour fields.
# Every rule is scoped to source_type = firewall (this pack assumes FortiGate fields; DECISIONS D-69).
# Site facts (home countries, night hours) come from config/site.yaml via "@site.<key>"; nothing site-specific is written here.

- id: F001
  version: 1
  title: One source touching many ports on one host within a minute (port scan)
  author: forgetrace
  technique: T1046
  tactic: Discovery
  severity: 2
  confidence: 0.9   # 100+ distinct ports on one target in 60 s is not application behaviour
  label_priority: 30
  type: threshold
  filter:
    all:
      - {field: source_type, op: eq, value: firewall}
      - {field: event_type, op: eq, value: net_conn}
      - {field: dst_port, op: not_null}
  group_by: [src_ip, dst_ip]
  threshold: {count: 100, distinct: dst_port, window: 60s}
  aggregate_by: [src_ip, dst_ip]

- id: F002
  version: 1
  title: Failed logins from many addresses of one /24 (distributed credential stuffing)
  author: forgetrace
  technique: T1110.004
  tactic: Credential Access
  severity: 3
  confidence: 0.7   # rotating addresses inside one /24 evade per-source thresholds; 15 in 6 h is unusual
  label_priority: 22
  type: threshold
  filter:
    all:
      - {field: source_type, op: eq, value: firewall}
      - {field: event_type, op: eq, value: auth_fail}
      - {field: src_subnet24, op: not_null}
  group_by: [src_subnet24]
  threshold: {count: 15, distinct: src_ip, window: 6h}
  aggregate_by: [src_subnet24]

- id: F003
  version: 1
  title: Failures from one /24 followed by a success from the same /24
  author: forgetrace
  technique: T1110.001
  tactic: Credential Access
  severity: 4
  confidence: 0.9   # the success after a failure burst is the compromise event
  label_priority: 21
  type: threshold
  filter:
    all:
      - {field: source_type, op: eq, value: firewall}
      - {field: event_type, op: eq, value: auth_fail}
      - {field: src_subnet24, op: not_null}
  group_by: [src_subnet24]
  threshold: {count: 10, window: 30m}
  followed_by:
    filter:
      all:
        - {field: event_type, op: eq, value: auth_success}
    join_on: [src_subnet24]
    within: 30m
  aggregate_by: [src_subnet24]

- id: F004
  version: 1
  title: Successful administrator login in the small hours from outside the operating countries
  author: forgetrace
  technique: T1078.001
  tactic: Initial Access
  severity: 3
  confidence: 0.7   # admin logins are rare; night-time and foreign together is the anomaly
  label_priority: 30
  type: match
  filter:
    all:
      - {field: source_type, op: eq, value: firewall}
      - {field: event_type, op: eq, value: auth_success}
      - {field: local_hour, op: lte, value: "@site.night_hours.to"}
      - {field: src_country, op: not_null}
      - not: {field: src_country, op: in, value: "@site.home_countries"}
  aggregate_by: [user]

- id: F005
  version: 1
  title: One VPN account connecting from two countries within minutes (impossible travel)
  author: forgetrace
  technique: T1078.004
  tactic: Initial Access
  severity: 3
  confidence: 0.7
