      - {field: src_is_external, op: eq, value: false}
      - {field: dst_is_external, op: eq, value: false}
      - {field: dst_port, op: in, value: [445, 3389, 139, 5985]}
  group_by: [src_ip]
  threshold: {count: 15, distinct: dst_ip, window: 1h}
