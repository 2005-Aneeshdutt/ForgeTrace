# --- Command and control confirmed by an upload to the same address (D-95, D-98) ---------------------------------------------------
# Periodic small connections alone look exactly like software telemetry; a C2 channel is the destination the
# network uploads a large volume to (any internal host, any order). Beacons are labelled C2; the upload keeps
# its exfiltration label.
- id: F022
  version: 2
  title: Repeated small connections to an external address that also receives a large upload from inside (C2 channel)
  author: forgetrace
  technique: T1071.001
  tactic: Command and Control
  severity: 3
  confidence: 0.9   # telemetry-like beacons are only kept when the address also takes data out
  label_priority: 32
  type: threshold
  filter:
    all:
      - {field: source_type, op: eq, value: firewall}
      - {field: event_type, op: eq, value: net_conn}
      - {field: src_is_external, op: eq, value: false}
      - {field: dst_is_external, op: eq, value: true}
      - {field: bytes_out, op: lte, value: 4096}
      - {field: dst_port, op: in, value: [80, 443, 8080, 8443]}
      - {field: dst_ip, op: in_set, among: {all: [{field: src_is_external, op: eq, value: false}, {field: bytes_out, op: gte, value: 20000000}]}}   # D-98: an address some internal host sends >= 20 MB to in one connection
  group_by: [src_ip, dst_ip]
  threshold: {count: 6, window: 2d}
  aggregate_by: [src_ip, dst_ip]

