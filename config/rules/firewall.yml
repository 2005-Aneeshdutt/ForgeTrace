# --- Remote services between internal hosts (D-94) -------------------------------------------------------
# A source subnet reaching an internal host on a remote-service port for the first time, and only among the
# first two such new destinations for that subnet and port: admin subnets and scanners fan out early and
# become established; a compromised workstation or server hopping to its next target does not.
- id: F018
  version: 1
  title: First RDP connection from this subnet to an internal host (lateral movement)
  author: forgetrace
  technique: T1021.001
  tactic: Lateral Movement
  severity: 3
  confidence: 0.7   # the novelty cap removes routine admin and scanner fan-out
  label_priority: 25
  type: baseline
  filter:
    all:
      - {field: source_type, op: eq, value: firewall}
      - {field: event_type, op: eq, value: net_conn}
      - {field: src_is_external, op: eq, value: false}
      - {field: dst_is_external, op: eq, value: false}
      - {field: dst_port, op: in, value: [3389]}
  first_seen:
    keys: [src_subnet24, dst_port, dst_ip]
    warmup: 12h
    novelty_cap: {within: [src_subnet24, dst_port], max: 2}
  aggregate_by: [src_ip, dst_ip]

