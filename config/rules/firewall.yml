- id: F007
  version: 2
  title: Many DNS lookups with very long labels under one domain (DNS tunnelling)
  author: forgetrace
  technique: T1071.004
  tactic: Command and Control
  severity: 3
  confidence: 0.9   # 30+ character labels repeated dozens of times under one domain encode data
  label_priority: 30
  type: threshold
  filter:
    all:
      - {field: source_type, op: eq, value: firewall}
      - {field: event_type, op: eq, value: dns_query}
      - {field: dns_label_max, op: gte, value: 30}
      - {field: domain_base, op: not_null}
  group_by: [src_ip, domain_base]
  threshold: {count: 10, window: 1h}   # D-100: slower C2 tunnels stay well above benign (0 benign >= 10/h on tune)
  aggregate_by: [src_ip, domain_base]

- id: F008
  version: 1
  title: Repeated small outbound connections from one host to one external address (beaconing)
  author: forgetrace
  technique: T1071.001
  tactic: Command and Control
  severity: 3
  confidence: 0.7   # benign destinations in this traffic are rarely revisited by the same host
  label_priority: 31
  type: threshold
  filter:
    all:
      - {field: source_type, op: eq, value: firewall}
      - {field: event_type, op: eq, value: net_conn}
      - {field: src_is_external, op: eq, value: false}
      - {field: dst_is_external, op: eq, value: true}
      - {field: bytes_out, op: lte, value: 4096}
  group_by: [src_ip, dst_ip]
  threshold: {count: 30, window: 6h}
  aggregate_by: [src_ip, dst_ip]

# Exfiltration by channel (D-95): only connections carrying >= 1 MB count, so the small beacons to the same
# address keep their C2 label; web ports = the established C2/web channel (T1041), other ports = an
# alternative protocol (T1048). DNS tunnelling is F007.
- id: F009
  version: 2
  title: Tens of MB uploaded to one external address over web ports (exfiltration over the C2/web channel)
  author: forgetrace
  technique: T1041
  tactic: Exfiltration
  severity: 4
  confidence: 0.7
  label_priority: 24
  type: threshold
  filter:
    all:
      - {field: source_type, op: eq, value: firewall}
      - {field: event_type, op: eq, value: net_conn}
      - {field: src_is_external, op: eq, value: false}
      - {field: dst_is_external, op: eq, value: true}
      - {field: bytes_out, op: gte, value: 1000000}
      - {field: dst_port, op: in, value: [80, 443, 8080, 8443]}
      - {field: dst_ip, op: rare, by: "@day", max_distinct: 1, among: {all: [{field: bytes_out, op: gte, value: 1000000}, {field: dst_is_external, op: eq, value: true}]}}   # D-96: a destination taking large uploads night after night is a backup target
  group_by: [src_ip, dst_ip]
  threshold: {sum: bytes_out, min: 30000000, window: 3d}
  aggregate_by: [src_ip, dst_ip]

- id: F023
  version: 1
  title: Tens of MB uploaded to one external address over a non-web protocol (exfiltration over an alternative protocol)
  author: forgetrace
  technique: T1048
  tactic: Exfiltration
  severity: 4
  confidence: 0.7
  label_priority: 24
  type: threshold
  filter:
    all:
      - {field: source_type, op: eq, value: firewall}
      - {field: event_type, op: eq, value: net_conn}
      - {field: src_is_external, op: eq, value: false}
      - {field: dst_is_external, op: eq, value: true}
      - {field: bytes_out, op: gte, value: 1000000}
      - not: {field: dst_port, op: in, value: [53, 80, 443, 8080, 8443]}
      - {field: dst_ip, op: rare, by: "@day", max_distinct: 1, among: {all: [{field: bytes_out, op: gte, value: 1000000}, {field: dst_is_external, op: eq, value: true}]}}   # D-96: a destination taking large uploads night after night is a backup target
  group_by: [src_ip, dst_ip]
  threshold: {sum: bytes_out, min: 30000000, window: 3d}
  aggregate_by: [src_ip, dst_ip]

- id: F010
  version: 1
  title: Firewall logging disabled or policies purged by an administrator
  author: forgetrace
  technique: T1562.002
  tactic: Defense Evasion
  severity: 4
  confidence: 0.9
  label_priority: 20
  type: match
  filter:
    all:
      - {field: source_type, op: eq, value: firewall}
      - {field: event_type, op: eq, value: config_change}
      - any:
          - {field: message, op: regex, value: "(?i)log[^']*setting'? changed from 'enable' to 'disable'"}
          - {field: message, op: regex, value: "(?i)were purged"}
  aggregate_by: [user]

